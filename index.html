<html lang="en">
<head>

<title>Wake & Study Stopwatch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(470px,94vw);padding:24px 14px}
h1{text-align:center;font-size:22px;margin:0 0 18px}
.box{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:18px;margin:12px 0}
.title{font-size:17px;font-weight:600;margin-bottom:8px}
.time{font-variant-numeric:tabular-nums;font-size:42px;font-weight:600;letter-spacing:-1px;margin:8px 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;width:100%}
button{border:0;border-radius:13px;padding:12px 16px;font-size:15px;font-weight:600;min-width:92px;transition:transform .08s ease,filter .08s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.94);filter:brightness(.88)}
.start{background:#fff;color:#111}.stop{background:#ff6868;color:#111}.reset{background:#ddd;color:#111;margin-left:18px}.toggle{margin-right:18px}.pip{background:#4ade80;color:#111;width:100%;margin-top:12px}
.status{text-align:center;color:#aaa;font-size:13px;min-height:20px;margin-top:10px}
.hint{text-align:center;color:#999;font-size:12px;line-height:1.45;margin-top:14px}
#pipCanvas{position:fixed;left:4px;bottom:4px;width:2px;height:1px;opacity:.02;pointer-events:none}
#pipVideo{position:fixed;left:8px;bottom:8px;width:2px;height:1px;opacity:.02;pointer-events:none}


.menu-btn{position:fixed;top:12px;left:12px;z-index:10001;width:46px;height:46px;min-width:46px;padding:0;border-radius:13px;background:#1b1b1b;color:#fff;border:1px solid #333;font-size:24px}
.drawer-backdrop{position:fixed;inset:0;z-index:10000;display:none;background:rgba(0,0,0,.58);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.drawer-backdrop.show{display:block}
.drawer{position:absolute;top:0;left:0;width:min(330px,82vw);height:100%;background:#171717;border-right:1px solid #333;padding:76px 16px 20px;transform:translateX(-102%);transition:transform .22s ease}
.drawer-backdrop.show .drawer{transform:translateX(0)}
.drawer-title{font-size:20px;font-weight:700;margin:0 8px 18px}
.drawer-item{width:100%;min-width:0;margin:0;padding:14px 15px;text-align:left;background:#242424;color:#fff;border:1px solid #3a3a3a;border-radius:14px;font-size:16px}
.history-modal{position:fixed;inset:0;z-index:10002;display:none;background:#111;overflow:auto}
.history-modal.show{display:block}
.history-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(17,17,17,.96);border-bottom:1px solid #333}
.history-close{width:44px;height:44px;min-width:44px;padding:0;margin:0;border-radius:12px;background:#242424;color:#fff;border:1px solid #3a3a3a;font-size:25px}
.history-title{font-size:20px;font-weight:700}
.history-body{width:min(620px,94vw);margin:0 auto;padding:18px 0 30px}
.history-status{text-align:center;color:#999;font-size:13px;min-height:20px;margin:4px 0 12px}
.history-card{background:#1b1b1b;border:1px solid #333;border-radius:18px;padding:16px;margin:12px 0}
.history-date{font-size:17px;font-weight:700;margin-bottom:12px}
.history-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #2d2d2d;font-variant-numeric:tabular-nums}
.history-label{color:#aaa}.history-value{font-weight:700}
.history-empty{text-align:center;color:#999;padding:40px 12px}
.reset-modal{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.58);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
}
.reset-modal.show{display:flex}
.reset-card{
  width:min(500px,84vw);
  background:#fff;
  color:#14213d;
  border-radius:22px;
  padding:21px 23px 19px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
}
.reset-question{
  font-size:clamp(18px,3.5vw,26px);
  line-height:1.18;
  font-weight:700;
  letter-spacing:-.2px;
  margin:0 0 19px;
}

  display:flex;
  gap:14px;
  width:100%;
}
.reset-actions button{
  flex:1;
  min-width:0;
  height:56px;
  border-radius:15px;
  font-size:clamp(17px,2.9vw,22px);
  font-weight:700;
  border:0;
  padding:0 12px;
}
.reset-yes{
  background:#1670e8;
  color:#fff;
}
.reset-no{
  background:#9aabba;
  color:#fff;
}
.reset-actions button:active{
  transform:scale(.97);
  filter:brightness(.94);
}

  .reset-modal{padding:14px}
  .reset-card{
    width:calc(100vw - 92px);
    max-width:500px;
    border-radius:20px;
    padding:19px 17px 17px;
  }
  .reset-question{
    font-size:clamp(17px,4.7vw,23px);
    margin-bottom:17px;
    white-space:nowrap;
  }
  .reset-actions{gap:11px}
  .reset-actions button{
    height:52px;
    border-radius:14px;
    font-size:clamp(16px,4.2vw,20px);
  }

</style>
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
<button id="menuBtn" class="menu-btn" aria-label="Open menu">☰</button>
<div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true">
  <aside class="drawer">
    <div class="drawer-title">Menu</div>
    <button id="trackRecordBtn" class="drawer-item">Track Record</button>
  </aside>
</div>
<div id="historyModal" class="history-modal" aria-hidden="true">
  <div class="history-head">
    <button id="historyClose" class="history-close" aria-label="Close">‹</button>
    <div class="history-title">Track Record</div>
  </div>
  <div class="history-body">
    <div id="historyStatus" class="history-status"></div>
    <div id="historyList"></div>
  </div>
</div>

<div class="wrap">
<h1>Wake & Study Stopwatch</h1>

<div class="box">
  <div class="title">📚 Study Time</div>
  <div id="studyTime" class="time">00:00:00</div>
  <div class="row">
    <button id="studyReset" class="reset">Reset</button>
    <button id="studyToggle" class="toggle start">Start</button>
  </div>
</div>

<div class="box">
  <div class="title">🌅 Awake Time</div>
  <div id="wakeTime" class="time">00:00:00</div>
  <div class="row">
    <button id="wakeReset" class="reset">Reset</button>
    <button id="wakeToggle" class="toggle start">Start</button>
  </div>
</div>

<button id="pip" class="pip">Open PiP</button>
<div id="status" class="status"></div>
<div class="hint">
  Awake Time can run continuously from the moment you wake up.<br>
  Study Time can be started/stopped for each study session and accumulates total study time.
</div>
</div>

<canvas id="pipCanvas" width="1400" height="788"></canvas>

<!-- Custom Reset Confirmation -->
<div id="resetModal" class="reset-modal" aria-hidden="true">
  <div class="reset-card" role="dialog" aria-modal="true" aria-labelledby="resetQuestion">
    <div id="resetQuestion" class="reset-question">Are you sure you want to reset?</div>
    <div class="reset-actions">
      <button id="resetYes" class="reset-yes">Yes</button>
      <button id="resetNo" class="reset-no">No</button>
    </div>
  </div>
</div>

<video id="pipVideo" playsinline autoplay muted></video>

<script>
const KEY="wake_study_stopwatch_v1";

let state;
try { state=JSON.parse(localStorage.getItem(KEY)||"null"); } catch(e) {}
if(!state){
  state={
    wake:{running:false,startTime:null,elapsed:0},
    study:{running:false,startTime:null,elapsed:0}
  };
}

const SESSION_KEY="wake_study_sessions_v1";
let sessionLog=[];
try{
  sessionLog=JSON.parse(localStorage.getItem(SESSION_KEY)||"[]");
  if(!Array.isArray(sessionLog))sessionLog=[];
}catch(e){sessionLog=[];}

function saveSessions(){
  localStorage.setItem(SESSION_KEY,JSON.stringify(sessionLog));
}

function openSession(type,start){
  sessionLog.push({type,start,end:null});
  saveSessions();
}

function closeSession(type,end=Date.now()){
  for(let i=sessionLog.length-1;i>=0;i--){
    if(sessionLog[i].type===type&&sessionLog[i].end===null){
      sessionLog[i].end=end;
      saveSessions();
      return;
    }
  }
}

const $=id=>document.getElementById(id);
const wakeTime=$("wakeTime"),studyTime=$("studyTime");
const wakeToggle=$("wakeToggle"),wakeReset=$("wakeReset");
const studyToggle=$("studyToggle"),studyReset=$("studyReset");
const pipBtn=$("pip"),statusEl=$("status"),canvas=$("pipCanvas"),video=$("pipVideo");
const ctx=canvas.getContext("2d");

for(const name of ["wake","study"]){
  const t=state[name];
  if(t&&t.running&&t.startTime&&!sessionLog.some(s=>s.type===name&&s.end===null)){
    sessionLog.push({type:name,start:t.startTime,end:null});
  }
}
saveSessions();

function save(){localStorage.setItem(KEY,JSON.stringify(state));}

function elapsed(t){
  if(t.running && t.startTime) return t.elapsed+(Date.now()-t.startTime);
  return t.elapsed;
}

function fmt(ms){
  let s=Math.floor(ms/1000);
  const h=Math.floor(s/3600); s%=3600;
  const m=Math.floor(s/60), sec=s%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function startTimer(t,name){
  if(!t.running){
    t.running=true;
    t.startTime=Date.now();
    openSession(name,t.startTime);
    save();
  }
}

function stopTimer(t,name){
  if(t.running){
    t.elapsed=elapsed(t);
    t.running=false;
    t.startTime=null;
    closeSession(name);
    save();
  }
}

function resetTimer(name){
  if(state[name].running){
    state[name].elapsed=elapsed(state[name]);
    closeSession(name);
  }
  state[name]={running:false,startTime:null,elapsed:0};
  save();
}

const resetModal=$("resetModal");
const resetYes=$("resetYes");
const resetNo=$("resetNo");
let resetTarget=null;

function openResetConfirm(name){
  resetTarget=name;
  resetModal.classList.add("show");
  resetModal.setAttribute("aria-hidden","false");
}

function closeResetConfirm(){
  resetTarget=null;
  resetModal.classList.remove("show");
  resetModal.setAttribute("aria-hidden","true");
}

resetYes.addEventListener("click",()=>{
  if(resetTarget){
    resetTimer(resetTarget);
    render();
  }
  closeResetConfirm();
});

resetNo.addEventListener("click",closeResetConfirm);

resetModal.addEventListener("click",(e)=>{
  if(e.target===resetModal) closeResetConfirm();
});

document.addEventListener("keydown",(e)=>{
  if(e.key==="Escape" && resetModal.classList.contains("show")){
    closeResetConfirm();
  }
});


wakeToggle.addEventListener("click",()=>{
  if(state.wake.running) stopTimer(state.wake,"wake");
  else startTimer(state.wake,"wake");
  render();
});
wakeReset.addEventListener("click",()=>openResetConfirm("wake"));

studyToggle.addEventListener("click",()=>{
  if(state.study.running) stopTimer(state.study,"study");
  else startTimer(state.study,"study");
  render();
});
studyReset.addEventListener("click",()=>openResetConfirm("study"));

function render(){
  wakeTime.textContent=fmt(elapsed(state.wake));
  studyTime.textContent=fmt(elapsed(state.study));

  wakeToggle.textContent=state.wake.running?"Stop":"Start";
  wakeToggle.className="toggle "+(state.wake.running?"stop":"start");
  studyToggle.textContent=state.study.running?"Stop":"Start";
  studyToggle.className="toggle "+(state.study.running?"stop":"start");

  drawPiP();
}

function drawPiP(){
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,1400,788);

  /* Each timer is centered vertically in its own half.
     The divider stays exactly between the two sections. */
  const mid=394;

  ctx.fillStyle="#aaa";
  ctx.font='600 58px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif';
  ctx.textAlign="left";
  ctx.textBaseline="middle";
  ctx.fillText("STUDY",56,mid-130);
  ctx.fillText("AWAKE",56,mid+130);

  ctx.font='600 124px -apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif';
  ctx.textAlign="right";
  ctx.fillStyle="#fff";
  ctx.fillText(fmt(elapsed(state.study)),1344,mid-130);
  ctx.fillStyle="#888";
  ctx.fillText(fmt(elapsed(state.wake)),1344,mid+130);

  /* One divider exactly between the two timer sections. */
  ctx.fillStyle="#777";
  ctx.fillRect(56,mid,1288,4);
}

let streamReady=false;
let syncingVideo=false;

/*
 Native PiP center Play/Pause controls STUDY TIME.
 Both timers remain visible in the PiP display.
 The two timers can always be independently controlled from the webpage.
*/
video.addEventListener("pause",()=>{
  if(syncingVideo)return;
  stopTimer(state.study,"study");
  render();
});

video.addEventListener("play",()=>{
  if(syncingVideo)return;
  startTimer(state.study,"study");
  render();
});

async function preparePiP(){
  render();

  if(!streamReady){
    if(!canvas.captureStream)throw new Error("Canvas captureStream is not supported");
    const stream=canvas.captureStream(10);
    video.srcObject=stream;
    video.muted=true;
    video.playsInline=true;
    video.setAttribute("playsinline","");
    video.setAttribute("autoplay","");

    syncingVideo=true;
    try{await video.play();}finally{syncingVideo=false;}

    await new Promise(r=>setTimeout(r,1000));
    streamReady=true;
  }

  if(video.webkitSupportsPresentationMode &&
     video.webkitSupportsPresentationMode("picture-in-picture") &&
     typeof video.webkitSetPresentationMode==="function"){
    video.webkitSetPresentationMode("picture-in-picture");
    return;
  }

  if(document.pictureInPictureEnabled &&
     typeof video.requestPictureInPicture==="function"){
    await video.requestPictureInPicture();
    return;
  }

  throw new Error("PiP is not available in this browser");
}

pipBtn.addEventListener("click",async()=>{
  statusEl.textContent="Opening PiP…";
  try{
    await preparePiP();
    statusEl.textContent="PiP opened • Study ऊपर, Awake नीचे";
  }catch(e){
    console.error(e);
    statusEl.textContent="PiP failed: "+(e.message||e.name);
  }
});

setInterval(render,250);
render();
</script>

<script>
const HISTORY_API="./api/records";
const IST=5.5*60*60*1000;
const menuBtn=$("menuBtn"),drawerBackdrop=$("drawerBackdrop");
const trackRecordBtn=$("trackRecordBtn"),historyModal=$("historyModal");
const historyClose=$("historyClose"),historyList=$("historyList"),historyStatus=$("historyStatus");

function dayKey(ms=Date.now()){
  const d=new Date(ms+IST);
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
}
function dayStart(key){
  const [y,m,d]=key.split("-").map(Number);
  return Date.UTC(y,m-1,d)-IST;
}
function dayLabel(key){
  const [y,m,d]=key.split("-").map(Number);
  return new Intl.DateTimeFormat("en-IN",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})
    .format(new Date(Date.UTC(y,m-1,d)));
}
function splitSessions(until=Date.now()){
  const totals={};
  for(const s of sessionLog){
    if(!s||!s.type||!Number.isFinite(s.start))continue;
    const end=s.end===null?until:Math.min(s.end,until);
    if(end<=s.start)continue;
    let cur=s.start;
    while(cur<end){
      const k=dayKey(cur), next=dayStart(k)+86400000, piece=Math.min(end,next);
      if(!totals[k])totals[k]={studyMs:0,awakeMs:0};
      if(s.type==="study")totals[k].studyMs+=piece-cur;
      if(s.type==="wake")totals[k].awakeMs+=piece-cur;
      cur=piece;
    }
  }
  return totals;
}
function completedKeys(now=Date.now()){
  const today=dayKey(now);
  const yesterday=dayKey(dayStart(today)-1000);
  const first=sessionLog.filter(s=>s&&Number.isFinite(s.start))
    .reduce((m,s)=>{const k=dayKey(s.start);return !m||k<m?k:m},null);
  if(!first||first>yesterday)return[];
  const out=[];let t=dayStart(first),last=dayStart(yesterday);
  while(t<=last){out.push(dayKey(t));t+=86400000}
  return out;
}
function uploaded(){
  try{
    const x=JSON.parse(localStorage.getItem("wake_study_uploaded_dates_v2")||"[]");
    return Array.isArray(x)?x:[];
  }catch(e){return[]}
}
function saveUploaded(x){
  localStorage.setItem("wake_study_uploaded_dates_v2",JSON.stringify([...new Set(x)].slice(-1000)));
}
async function sendDay(k,totals){
  const r=totals[k]||{studyMs:0,awakeMs:0};
  const res=await fetch(HISTORY_API,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({date:k,studyMs:Math.floor(r.studyMs),awakeMs:Math.floor(r.awakeMs)}),
    cache:"no-store"
  });
  const data=await res.json();
  if(!res.ok||!data.ok)throw new Error(data.error||"Upload failed");
}
let uploading=false;
async function uploadDueDays(){
  if(uploading)return;
  uploading=true;
  try{
    const now=Date.now(),d=new Date(now+IST);
    const due=completedKeys(now);
    const todayKey=dayKey(now);
    // Page open at 11:59:59 PM: upload today's live snapshot too.
    // This is NOT marked done below — it's a partial/safety snapshot only.
    // Tomorrow, once today is a genuinely completed day, its final/accurate
    // total must still be allowed to upload (backend keeps whichever
    // upload has the higher Study Time, so the final one wins).
    const isSnapshot=d.getUTCHours()===23&&d.getUTCMinutes()===59&&d.getUTCSeconds()===59;
    if(isSnapshot)due.push(todayKey);
    const list=[...new Set(due)], totals=splitSessions(now), done=uploaded();
    for(const k of list){
      if(done.includes(k))continue;
      await sendDay(k,totals);
      if(!(isSnapshot&&k===todayKey)){
        done.push(k);
        saveUploaded(done);
      }
      statusEl.textContent="Daily record uploaded • "+dayLabel(k);
    }
  }catch(e){
    console.error(e);
    statusEl.textContent="Daily upload pending";
  }finally{uploading=false}
}

menuBtn.addEventListener("click",()=>{
  drawerBackdrop.classList.toggle("show");
});
drawerBackdrop.addEventListener("click",e=>{
  if(e.target===drawerBackdrop)drawerBackdrop.classList.remove("show");
});
historyClose.addEventListener("click",()=>{
  historyModal.classList.remove("show");
  historyModal.setAttribute("aria-hidden","true");
});
trackRecordBtn.addEventListener("click",async()=>{
  drawerBackdrop.classList.remove("show");
  historyModal.classList.add("show");
  historyModal.setAttribute("aria-hidden","false");
  historyStatus.textContent="Loading…";
  historyList.innerHTML="";
  try{
    const res=await fetch(HISTORY_API,{cache:"no-store"});
    const data=await res.json();
    if(!res.ok||!data.ok)throw new Error(data.error||"Load failed");
    const records=Array.isArray(data.records)?data.records:[];
    if(!records.length){
      historyStatus.textContent="";
      historyList.innerHTML='<div class="history-empty">No track records yet.</div>';
      return;
    }
    historyStatus.textContent=records.length+" day"+(records.length===1?"":"s");
    historyList.innerHTML=records.map(r=>`
      <div class="history-card">
        <div class="history-date">📅 ${dayLabel(r.date)}</div>
        <div class="history-row"><span class="history-label">📚 Study Time</span><span class="history-value">${fmt(Number(r.studyMs)||0)}</span></div>
        <div class="history-row"><span class="history-label">🌅 Awake Time</span><span class="history-value">${fmt(Number(r.awakeMs)||0)}</span></div>
      </div>`).join("");
  }catch(e){
    historyStatus.textContent="";
    historyList.innerHTML='<div class="history-empty">Track Record load nahi ho saka.</div>';
  }
});

setInterval(uploadDueDays,10000);
uploadDueDays();

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    drawerBackdrop.classList.remove("show");
    historyModal.classList.remove("show");
  }
});
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      // Force the browser to check the latest service-worker script.
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const registration of registrations) {
        try { await registration.update(); } catch(e) {}
      }

      // Cache-bust the worker script itself so browsers stuck on an
      // older registration are forced to fetch the current worker.
      const registration = await navigator.serviceWorker.register("./sw.js?v=5");
      try { await registration.update(); } catch(e) {}
    } catch (e) {
      console.error("Service worker update failed:", e);
    }
  });
}
</script>
